server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: UM_STUDY_SESSION
        max-age: 30d
        http-only: true
        same-site: lax

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  session:
    store-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

app:
  allowed-email-domain: um.edu.my
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  session-cookie-name: um_study_session
  session-ttl-hours: 12
  secret-key: ${APP_SECRET_KEY:dev-only-do-not-use-in-prod-please}
  spectrum:
    client: ${SPECTRUM_CLIENT:stub}            # stub | moodle
    base-url: ${SPECTRUM_BASE_URL:https://spectrum.um.edu.my}
  semester-start-date: ${SEMESTER_START_DATE:2026-03-09}        # Monday of Week 1
  semester-break-start-date: ${SEMESTER_BREAK_START_DATE:2026-04-27}  # Monday of mid-sem break (week is skipped)

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # File-backed H2 so sessions and tokens survive a backend restart.
    # Override with SPRING_DATASOURCE_URL=jdbc:h2:mem:... to go back to in-memory.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/umstudy;AUTO_SERVER=TRUE;MODE=PostgreSQL}
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  # No OAuth in dev — the dev alias short-circuits the button click.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: prod
  # Defaults to in-memory H2 so the prod profile boots without any DB env vars
  # (suitable for Render's free tier — data is wiped on each restart).
  # Override DB_URL / DB_USER / DB_PASSWORD / DB_DRIVER / JPA_DIALECT for a real Postgres.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:umstudy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate.dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
